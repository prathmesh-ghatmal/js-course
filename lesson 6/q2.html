  <body>
    <script>
      const hour = 24;
      const name = "prathmesh";
      if (hour > 24) {
        alert("invalid input");
      } else if (hour < 12) {
        alert("Good Morning!!" + name);
      } else if (hour <= 15) {
        alert("Good AfterNoon!!!" + name);
      } else if (hour <= 20) {
        alert("Good Evening" + name);
      } else {
        alert("Good Night" + name);
      }
    </script>
